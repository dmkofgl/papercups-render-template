services:
  - type: web
    name: papercups
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: papercups-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RELEASE_COOKIE
        generateValue: true
      - key: PORT
        value: 4000
databases:
  - name: papercups-db
    plan: free
    databaseName: papercups_prod
    user: papercups_user
